<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200" />
  <title>superlock banner</title>
  <style>
    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0b0b0b;
    }

    body {
      display: grid;
      place-items: center;
    }

    #logo svg {
      display: block;
      width: 1040px;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="logo"></div>
  <script>
    const FROZEN = '<style>*{animation:none!important}</style>'

    fetch('../anatomy/wordmark.svg')
      .then(response => response.text())
      .then(svg => {
        document.getElementById('logo').innerHTML = svg.replace('</svg>', `${FROZEN}</svg>`)
      })
  </script>
</body>
</html>
