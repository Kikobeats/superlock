name: benchmark

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Restore previous benchmark
        uses: actions/cache/restore@v6
        with:
          path: cache/benchmark-data.json
          key: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: benchmark-
      - name: Run benchmark
        run: node benchmark/index.js
      - name: Record benchmark
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: j3hempsey-actions/github-action-benchmark@v1.0.5
        with:
          name: superlock
          tool: customSmallerIsBetter
          output-file-path: benchmark-output.json
          external-data-json-path: cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          comment-always: false
          pr-comment-always: false
          comment-on-alert: false
          fail-on-alert: false
          summary-always: false
      - name: Comment on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node benchmark/comment.js cache/benchmark-data.json
      - name: Save benchmark
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: cache/benchmark-data.json
          key: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
